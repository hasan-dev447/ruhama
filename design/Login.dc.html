<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruhama · লগইন</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./ruhama.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&amp;family=Cormorant+Garamond:wght@600&amp;family=Hind+Siliguri:wght@400;500;600&amp;family=Inter:wght@400;500;600&amp;family=Noto+Serif+Bengali:wght@600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="rh" data-theme="{{theme}}" lang="bn">
  <main class="auth-wrap">
    <div class="rh-pattern" aria-hidden="true" style="z-index: -1"></div>
    <div class="hero__glow" aria-hidden="true" style="top: -200px"></div>
    <div style="position: absolute; top: 16px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: center">
      <a href="Main.dc.html" class="link-arrow" style="min-height: 44px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="transform: none"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>হোমে ফিরুন</a>
      <button type="button" class="btn-icon" aria-label="{{themeLabel}}" onClick="{{toggleTheme}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg></button>
    </div>

    <div class="card card-raised auth-card rh-in">
      <div style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px">
        <a href="Main.dc.html" class="brand" aria-label="Ruhama হোম" style="flex-direction: column; gap: 8px">
          <svg class="mark" viewBox="0 0 48 48" aria-hidden="true" style="width: 44px; height: 44px; color: var(--rh-accent); stroke-width: 2.2"><path d="M24 5Q32.78 20.36 37.43 37.43Q20.36 32.78 5 24Q20.36 15.22 37.43 10.57Q32.78 27.64 24 43Q15.22 27.64 10.57 10.57Q27.64 15.22 43 24Q27.64 32.78 10.57 37.43Q15.22 20.36 24 5Z"></path></svg>
          <span class="brand__word">Ruhama</span>
        </a>
        <h1 class="t-h3" style="margin-top: 10px">আবার স্বাগতম</h1>
        <p class="t-small t-muted">আপনার যাত্রা যেখানে থেমেছিল, সেখান থেকেই শুরু করুন।</p>
      </div>

      <sc-if value="{{pwMode}}" hint-placeholder-val="{{true}}">
        <form onSubmit="{{submit}}" style="display: flex; flex-direction: column; gap: 16px; margin-top: 28px">
          <div class="field"><label class="label" for="l-email">ইমেইল</label><input id="l-email" class="input" type="email" required="" autocomplete="email" placeholder="you@example.com"></div>
          <div class="field">
            <div style="display: flex; justify-content: space-between; align-items: baseline"><label class="label" for="l-pass">পাসওয়ার্ড</label><a href="#" class="t-small link">ভুলে গেছেন?</a></div>
            <div style="position: relative">
              <input id="l-pass" class="input" type="{{pwType}}" required="" autocomplete="current-password" style="padding-right: 52px">
              <button type="button" class="btn-icon" aria-label="{{pwLabel}}" onClick="{{togglePw}}" style="position: absolute; right: 3px; top: 3px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
            </div>
          </div>
          <label class="check"><input type="checkbox" checked="">এই ডিভাইসে লগইন থাকুক</label>
          <button type="submit" class="btn btn-primary btn-lg btn-block">লগইন</button>
        </form>
      </sc-if>
      <sc-if value="{{linkMode}}" hint-placeholder-val="{{false}}">
        <form onSubmit="{{sendLink}}" style="display: flex; flex-direction: column; gap: 16px; margin-top: 28px">
          <sc-if value="{{notLinkSent}}" hint-placeholder-val="{{true}}">
            <div class="field"><label class="label" for="l-email2">ইমেইল</label><input id="l-email2" class="input" type="email" required="" autocomplete="email" placeholder="you@example.com"><span class="hint">পাসওয়ার্ড ছাড়াই, এক ক্লিকে লগইনের লিংক পাঠানো হবে।</span></div>
            <button type="submit" class="btn btn-primary btn-lg btn-block">লগইন লিংক পাঠান</button>
          </sc-if>
          <sc-if value="{{linkSent}}" hint-placeholder-val="{{false}}">
            <div role="status" class="adab-strip" style="background: var(--rh-success-soft)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--rh-success); margin-top: 3px"><rect width="20" height="16" x="2" y="4" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg><p class="t-small"><strong>ইনবক্স দেখুন।</strong> লিংকটি ১৫ মিনিট কার্যকর থাকবে।</p></div>
          </sc-if>
        </form>
      </sc-if>

      <div class="auth-sep" style="margin: 22px 0">অথবা</div>
      <button type="button" class="btn btn-secondary btn-block" onClick="{{switchMode}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg>{{switchText}}</button>
      <p class="t-small t-muted" style="text-align: center; margin-top: 24px">নতুন? <a href="Register.dc.html" class="link" style="font-weight: 600">অ্যাকাউন্ট খুলুন</a></p>
    </div>

    <p class="ar" lang="ar" dir="rtl" style="position: absolute; bottom: 20px; left: 0; right: 0; text-align: center; font-size: 22px; color: var(--rh-muted); opacity: 0.8">رُحَمَاءُ بَيْنَهُمْ</p>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.state.dark ?? (this.props.theme === 'dark');
    const link = !!this.state.link;
    const show = !!this.state.show;
    const sent = !!this.state.sent;
    return {
      theme: dark ? 'dark' : 'light',
      toggleTheme: () => this.setState({ dark: !dark }),
      themeLabel: dark ? 'লাইট মোড চালু করুন' : 'ডার্ক মোড চালু করুন',
      pwMode: !link, linkMode: link,
      switchText: link ? 'পাসওয়ার্ড দিয়ে লগইন' : 'ইমেইলে লগইন লিংক নিন',
      switchMode: () => this.setState({ link: !link, sent: false }),
      pwType: show ? 'text' : 'password',
      pwLabel: show ? 'পাসওয়ার্ড লুকান' : 'পাসওয়ার্ড দেখুন',
      togglePw: () => this.setState({ show: !show }),
      submit: (e) => { if (e && e.preventDefault) e.preventDefault(); },
      linkSent: sent, notLinkSent: !sent,
      sendLink: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ sent: true }); }
    };
  }
}
</script>
</body>
</html>
